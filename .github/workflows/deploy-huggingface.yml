# Publica o sistema no Hugging Face Spaces a cada push na main.
# Configuração (uma vez, no GitHub em Settings > Secrets and variables > Actions):
#   secret   HF_TOKEN  = token do Hugging Face com permissão de escrita
#   variable HF_SPACE  = usuario/nome-do-space
name: Deploy no Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub==0.26.5
      - run: python deploy/huggingface/sync_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
